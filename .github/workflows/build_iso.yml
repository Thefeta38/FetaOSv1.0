name: Build Feta OS (Zero Debian - Modern)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:testing
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap debian-archive-keyring git curl

      - name: Build Feta OS ISO
        run: |
          mkdir -p build && cd build
          
          # Χρήση Debian Testing (Trixie) για νεότερες εκδόσεις/Kernel
          lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootloader grub-pc
          
          # Ελαφρύ περιβάλλον XFCE, Whiskermenu (Win11 style) & Μοντέρνο Θέμα
          mkdir -p config/package-lists
          echo "xfce4 xfce4-whiskermenu-plugin lightdm network-manager-gnome virtualbox-guest-x11 virtualbox-guest-utils firefox-esr libreoffice libreoffice-l10n-el scratch geogebra tuxpaint gimp vlc arc-theme papirus-icon-theme" > config/package-lists/feta.list.chroot
          
          # Branding 1: Οθόνη GRUB (Εκκίνηση)
          mkdir -p config/includes.chroot/etc/default
          echo 'GRUB_DISTRIBUTOR="Feta OS version 1 PC"' > config/includes.chroot/etc/default/grub
          
          # Branding 2: Ολική εξαφάνιση της λέξης Debian από παντού
          mkdir -p config/hooks/live
          cat << 'EOF' > config/hooks/live/0100-feta-full-branding.hook.chroot
          #!/bin/sh
          # Όνομα Υπολογιστή
          echo "feta-os" > /etc/hostname

          # Αρχείο Ρυθμίσεων / Πληροφοριών Συστήματος
          cat << 'OSRELEASE' > /etc/os-release
          NAME="Feta OS"
          VERSION="1 PC"
          ID=fetaos
          PRETTY_NAME="Feta OS version 1 PC"
          VERSION_ID="1"
          HOME_URL="https://github.com"
          OSRELEASE

          cat << 'LSBRELEASE' > /etc/lsb-release
          DISTRIB_ID=FetaOS
          DISTRIB_RELEASE=1
          DISTRIB_CODENAME=feta
          DISTRIB_DESCRIPTION="Feta OS version 1 PC"
          LSBRELEASE

          # Κείμενο Τερματικού & Boot
          echo "Feta OS version 1 PC \n \l" > /etc/issue
          echo "Feta OS version 1 PC" > /etc/issue.net

          # Αφαίρεση πακέτων που φέρουν το σήμα/όνομα του Debian
          apt-get purge -y desktop-base || true
          EOF
          chmod +x config/hooks/live/0100-feta-full-branding.hook.chroot
          
          # Χτίσιμο ISO
          lb build
          mv live-image-amd64.hybrid.iso ../Feta_OS_v1.iso

      - name: Upload ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Feta OS version 1 PC
          files: Feta_OS_v1.iso










  
