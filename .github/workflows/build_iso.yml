name: Build Feta OS (Ubuntu-based Win11)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools

      - name: Build Feta OS ISO
        run: |
          mkdir -p build && cd build
          
          # Ρύθμιση για Ubuntu 24.04 (Noble) με δικαιώματα root
          sudo lb config \
            --mode ubuntu \
            --distribution noble \
            --architectures amd64 \
            --archive-areas "main restricted universe multiverse" \
            --bootloader grub-pc
          
          # Πακέτα: XFCE Desktop, Firefox, LibreOffice, Σχολικά & Drivers
          sudo mkdir -p config/package-lists
          echo "xubuntu-desktop virtualbox-guest-x11 virtualbox-guest-utils firefox libreoffice libreoffice-l10n-el scratch geogebra tuxpaint gimp vlc" | sudo tee config/package-lists/feta.list.chroot
          
          # Branding: Feta OS στην εκκίνηση
          sudo mkdir -p config/includes.chroot/etc/default
          echo 'GRUB_DISTRIBUTOR="Feta OS"' | sudo tee config/includes.chroot/etc/default/grub
          
          sudo mkdir -p config/hooks/live
          cat << 'EOF' | sudo tee config/hooks/live/0100-feta-branding.hook.chroot
          #!/bin/sh
          echo "feta-os" > /etc/hostname
          sed -i 's/Ubuntu/Feta OS/g' /etc/os-release
          sed -i 's/UBUNTU/FETA_OS/g' /etc/os-release
          EOF
          sudo chmod +x config/hooks/live/0100-feta-branding.hook.chroot
          
          # Χτίσιμο ISO με sudo
          sudo lb build
          sudo mv live-image-amd64.hybrid.iso ../Feta_OS_Ubuntu_Win11.iso

      - name: Upload ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: Feta OS v4.0 (Ubuntu Win11 Light)
          files: Feta_OS_Ubuntu_Win11.iso






  
