name: Build Advanced Feta OS Win7 Edition

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap debian-archive-keyring

      - name: Configure and Build Debian ISO
        run: |
          mkdir -p build && cd build
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware"
          
          echo "task-lxde-desktop firefox-esr libreoffice" > config/package-lists/feta.list.chroot
          
          lb build
          mv live-image-amd64.hybrid.iso ../feta_os_win7_advanced.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FetaOS-Advanced-Win7-ISO
          path: feta_os_win7_advanced.iso




  
