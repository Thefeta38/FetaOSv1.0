name: Build Advanced Feta OS Win7 Edition

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Complete Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring

      - name: Configure and Build Debian ISO
        run: |
          mkdir -p build && cd build
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/"
          
          # Εγγραφή των πακέτων στο επίσημο αρχείο λίστας του live-build
          echo "task-lxde-desktop firefox-esr libreoffice" | sudo tee config/package-lists/feta.list.chroot
          
          sudo lb build
          mv live-image-amd64.hybrid.iso ../feta_os_win7_advanced.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FetaOS-Advanced-Win7-ISO
          path: feta_os_win7_advanced.iso



  
